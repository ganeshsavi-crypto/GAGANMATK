<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gogami OTP Verification</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; width: 360px; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; }
    h2 { margin-top: 0; color: #1e293b; font-size: 22px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; }
    button { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1ebc57; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .msg { margin-top: 15px; font-size: 13px; font-weight: 600; word-break: break-word; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
    .info { color: #2563eb; }
    .verify-box { display: none; margin-top: 20px; border-top: 1px dashed #e2e8f0; padding-top: 20px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Gogami Verification</h2>
  <p>अपना WhatsApp नंबर दर्ज करके OTP प्राप्त करें</p>

  <input type="text" id="phone" value="919113224019" placeholder="कंट्री कोड सहित नंबर">
  <button id="sendBtn" onclick="handleSendOtp()">WhatsApp पर OTP भेजें</button>

  <div class="verify-box" id="verifyBox">
    <input type="text" id="otpInput" placeholder="6 अंकों का OTP दर्ज करें" maxlength="6">
    <button onclick="handleVerifyOtp()" style="background: #0284c7; margin-top: 10px;">सत्यापित करें (Verify)</button>
  </div>

  <div class="msg" id="statusMsg"></div>
</div>

<script>
  const PHONE_NUMBER_ID = "1395614946961226";
  const ACCESS_TOKEN = "EABBBMoMzN4YBSqMa8ZBnCoEVHZCsb8YTHl8npGxuJqsISGw67DDNf2vneaEisZBFXWSD5KG4uBks1dk13Sck2ZBkc1QF0tg5sneueE5Ck7zN4Tl7MtGRwpy4k2ER53iaZA68FpTopc7AItyDpXzODs9Wgf3U3X5cKhNvR4aYc65QTkxOyxCkASi6sjNXAqAZDZD";

  let realOtp = "";

  async function handleSendOtp() {
    const phone = document.getElementById("phone").value.trim();
    const statusMsg = document.getElementById("statusMsg");
    const sendBtn = document.getElementById("sendBtn");

    if (!phone) {
      statusMsg.className = "msg error";
      statusMsg.innerText = "कृपया मोबाइल नंबर डालें।";
      return;
    }

    realOtp = Math.floor(100000 + Math.random() * 900000).toString();

    sendBtn.disabled = true;
    sendBtn.innerText = "भेजा जा रहा है...";
    statusMsg.className = "msg info";
    statusMsg.innerText = "WhatsApp सर्वर से संपर्क किया जा रहा है...";

    // Meta की आवश्यकतानुसार Body और Url Button दोनों में OTP पैरामीटर:
    const payload = {
      messaging_product: "whatsapp",
      to: phone,
      type: "template",
      template: {
        name: "gogami",
        language: { code: "en" },
        components: [
          {
            type: "body",
            parameters: [
              { type: "text", text: realOtp }
            ]
          },
          {
            type: "button",
            sub_type: "url",
            index: "0",
            parameters: [
              { type: "text", text: realOtp }
            ]
          }
        ]
      }
    };

    const targetUrl = `https://graph.facebook.com/v26.0/${PHONE_NUMBER_ID}/messages`;

    try {
      const response = await fetch(targetUrl, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${ACCESS_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (response.ok && result.messages) {
        statusMsg.className = "msg success";
        statusMsg.innerText = "सफलता! OTP आपके WhatsApp पर प्राप्त हो चुका है।";
        document.getElementById("verifyBox").style.display = "block";
      } else {
        const errorDetail = result.error ? (result.error.error_data?.details || result.error.message) : JSON.stringify(result);
        statusMsg.className = "msg error";
        statusMsg.innerText = "मेटा एरर: " + errorDetail;
      }
    } catch (err) {
      statusMsg.className = "msg error";
      statusMsg.innerText = "नेटवर्क एरर: " + err.message;
    } finally {
      sendBtn.disabled = false;
      sendBtn.innerText = "WhatsApp पर OTP भेजें";
    }
  }

  function handleVerifyOtp() {
    const entered = document.getElementById("otpInput").value.trim();
    const statusMsg = document.getElementById("statusMsg");

    if (entered === realOtp) {
      statusMsg.className = "msg success";
      statusMsg.innerText = "बधाई हो! OTP सत्यापित हो गया और लॉगिन सफल रहा।";
    } else {
      statusMsg.className = "msg error";
      statusMsg.innerText = "गलत OTP दर्ज किया गया है। पुनः प्रयास करें।";
    }
  }
</script>

</body>
</html>
